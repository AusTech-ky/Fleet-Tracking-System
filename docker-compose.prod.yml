# Production stack for a single host (VM). Gets real FTC927 devices online.
#
#   cp .env.prod.example .env && edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Topology — note the two DIFFERENT kinds of traffic:
#
#   Browsers  ──HTTPS/WSS(443)──► caddy ──► web(3001) + control-plane(3000)
#   Devices   ──raw TCP(5027)───► ingestion            (NOT through caddy:
#                                                       Teltonika speaks a binary
#                                                       protocol, not HTTP)
#
# See docs/DEPLOYMENT.md for the runbook (DNS, firewall, device config).
name: fleetview

services:
  db:
    image: timescale/timescaledb-ha:pg16 # TimescaleDB + PostGIS
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fleet
    volumes:
      # All numbered migrations run in order on a fresh volume.
      - ./services/control-plane/migrations:/docker-entrypoint-initdb.d:ro
      - dbdata:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fleet']
      interval: 10s
      timeout: 5s
      retries: 12
    # Not published to the host: only reachable on the internal network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12

  # Device-facing ingestion. THIS is the port your trackers dial into.
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      TCP_PORT: '5027'
      UDP_PORT: ${INGEST_UDP_PORT:-off}
      HTTP_PORT: '9100'
      REDIS_URL: redis://redis:6379
      WAL_DIR: /wal
      MAX_CONNECTIONS: ${INGEST_MAX_CONNECTIONS:-50000}
      SHUTDOWN_GRACE_MS: '15000'
      # TLS_ENABLED=true requires certs mounted below AND device-side certs.
      TLS_ENABLED: ${INGEST_TLS_ENABLED:-false}
      TLS_KEY_PATH: /certs/server.key
      TLS_CERT_PATH: /certs/server.crt
    ports:
      - '${INGEST_TCP_PORT:-5027}:5027/tcp'
    volumes:
      - waldata:/wal # durable buffer: acked-but-not-yet-consumed records
      - ./certs:/certs:ro
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fleet
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      SMTP_URL: ${SMTP_URL:-}
      TRIP_STOP_MIN_SEC: ${TRIP_STOP_MIN_SEC:-180}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked in at build time — rebuild if the domain changes.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
        NEXT_PUBLIC_WS_URL: wss://${API_DOMAIN}
        NEXT_PUBLIC_DEFAULT_BASEMAP: ${DEFAULT_BASEMAP:-streets}
    restart: unless-stopped
    depends_on:
      - control-plane

  # TLS termination + routing for browser traffic. Caddy obtains and renews
  # Let's Encrypt certificates automatically once DNS points at this host.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - control-plane

volumes:
  dbdata:
  redisdata:
  waldata:
  caddydata:
  caddyconfig:
