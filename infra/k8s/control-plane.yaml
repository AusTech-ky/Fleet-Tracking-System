# Control-plane (API + WebSocket + GraphQL) and web app.
# STATUS: written, never applied to a live cluster — see docs/DEPLOYMENT.md.
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-control-plane
spec:
  selector: { app: fleet-control-plane }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-control-plane
spec:
  replicas: 2
  selector:
    matchLabels: { app: fleet-control-plane }
  template:
    metadata:
      labels: { app: fleet-control-plane }
    spec:
      containers:
        - name: control-plane
          image: ghcr.io/your-org/fleet-control-plane:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: '3000' }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fleet-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: fleet-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fleet-secrets, key: jwt-secret } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: fleet-config, key: app-origin } }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: '1', memory: 768Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleet-control-plane
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fleet-control-plane }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-web
spec:
  selector: { app: fleet-web }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: fleet-web }
  template:
    metadata:
      labels: { app: fleet-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/fleet-web:latest # built with NEXT_PUBLIC_* baked in
          ports: [{ containerPort: 3001 }]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
# Browser traffic only. Device traffic uses the NLB in ingestion.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  rules:
    - host: api.fleet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: fleet-control-plane, port: { number: 3000 } } }
    - host: fleet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: fleet-web, port: { number: 3001 } } }
